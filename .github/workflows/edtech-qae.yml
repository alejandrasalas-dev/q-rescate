name: EdTech QAE PoC

on:
  push:
    branches: [feat/edtech-qae]
  pull_request:
    branches: [feat/edtech-qae]
  workflow_dispatch:

jobs:
  quantum-probability-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qiskit for EdTech
        run: |
          python -m pip install -r requirements-edtech.txt
      - name: Validate calculations and Qiskit IQAE
        run: python -m pytest edtech/tests -q
      - name: Run educational classical / quantum experiment
        run: |
          set -o pipefail
          python -m edtech.experiment --probability 0.2 --samples 256 --epsilon 0.15 --shots 100 --seed 42 | tee edtech-results.json
      - name: Check report integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("edtech-results.json").read_text())
          assert r["reference_probability"] == 0.2
          assert 0 <= r["quantum"]["estimate"] <= 1
          assert len(r["scientific_caveats"]) >= 4
          print("Resultados EdTech validados; ventaja práctica NO demostrada.")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edtech-qae-results
          path: edtech-results.json
          if-no-files-found: warn
