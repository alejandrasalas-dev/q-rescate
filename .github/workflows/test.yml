name: Validate and benchmark Q-Rescate
on:
  push:
    branches: [feat/qaoa-poc]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run exact vs QAOA experiment
        run: python qrescate.py | tee benchmark-results.json
      - name: Upload experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-benchmark-results
          path: benchmark-results.json
          if-no-files-found: warn
